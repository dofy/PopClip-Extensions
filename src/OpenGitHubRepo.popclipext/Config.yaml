name:
  en: Open GitHub Repo
  zh-hans: 打开 GitHub 项目
  zh-hant: 開啟 GitHub 倉庫
  ja: GitHubリポジトリを開く
  ko: GitHub 저장소 열기
  fr: Ouvrir un dépôt GitHub
  es: Abrir repositorio de GitHub
icon: assets/github.svg
identifier: org.phpz.popclip.extension.open-github-repo
popclip version: 6159
description:
  en: Open a GitHub repository in a web browser from selected text like AUTHOR/REPO.
  zh-hans: 根据类似 AUTHOR/REPO 的选中文本在浏览器中打开 GitHub 仓库。
  zh-hant: 根據類似 AUTHOR/REPO 的選取文字在瀏覽器中開啟 GitHub 儲存庫。
  ja: AUTHOR/REPOの形式で選択したテキストからGitHubリポジトリをブラウザで開きます。
  ko: AUTHOR/REPO 형식의 선택한 텍스트로 GitHub 저장소를 브라우저에서 엽니다.
  fr: Ouvre dans un navigateur un dépôt GitHub à partir d’un texte comme AUTHOR/REPO.
  es: Abre en el navegador un repositorio de GitHub a partir de texto como AUTHOR/REPO.
keywords: github repository repo browser
regex: ^\s*[\w\-\.]+\s*/\s*[\w\-\.]+\s*$
entitlements:
  - dynamic
options:
  - identifier: username
    label:
      en: GitHub Username
      zh-hans: GitHub 用户名
      zh-hant: GitHub 用戶名
      ja: GitHubユーザー名
      ko: GitHub 사용자 이름
      fr: Nom d’utilisateur GitHub
      es: Nombre de usuario de GitHub
    type: string
module: lib/GitHubRepo.ts
