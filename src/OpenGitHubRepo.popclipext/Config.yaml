name:
  en: Open GitHub Repo
  zh-hans: 打开 GitHub 项目
  zh-hant: 開啟 GitHub 倉庫
  ja: GitHubリポジトリを開く
  ko: GitHub 저장소 열기
  fr: Ouvrir un dépôt GitHub
  es: Abrir repositorio de GitHub
icon: assets/github.svg
identifier: org.phpz.popclip.extension.open-github-repo
popclip version: 6159
description:
  en: Open a GitHub repository from selected text containing a GitHub URL, AUTHOR/REPO, or a scoped npm package.
  zh-hans: 根据包含 GitHub URL、AUTHOR/REPO 或 scoped npm 包的选中文本打开 GitHub 仓库。
  zh-hant: 根據包含 GitHub URL、AUTHOR/REPO 或 scoped npm 套件的選取文字開啟 GitHub 儲存庫。
  ja: GitHub URL、AUTHOR/REPOまたはscoped npmパッケージを含む選択テキストからGitHubリポジトリを開きます。
  ko: GitHub URL, AUTHOR/REPO 또는 scoped npm 패키지를 포함한 선택 텍스트에서 GitHub 저장소를 엽니다.
  fr: Ouvre un dépôt GitHub à partir d’un texte contenant une URL GitHub, AUTHOR/REPO ou un paquet npm scoped.
  es: Abre un repositorio desde texto que contenga una URL de GitHub, AUTHOR/REPO o un paquete npm con scope.
keywords: github repository repo browser npm package
regex: '[\w\-\.]+\s*/\s*[\w\-\.]+'
entitlements:
  - dynamic
options:
  - identifier: username
    label:
      en: GitHub Username
      zh-hans: GitHub 用户名
      zh-hant: GitHub 用戶名
      ja: GitHubユーザー名
      ko: GitHub 사용자 이름
      fr: Nom d’utilisateur GitHub
      es: Nombre de usuario de GitHub
    type: string
    inset: true
module: lib/GitHubRepo.ts
