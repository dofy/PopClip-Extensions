name:
  en: 'Color Conversion'
  zh-hans: '颜色转换'
  zh-hant: '顏色轉换'
  ja: 'カラー変換'
  ko: '색상 변환'
  fr: 'Conversion de couleurs'
  es: 'Conversión de colores'
version: 1
identifier: xyz.phpz.popclip.extension.rgbhex
popclip version: 6159
icon: icon.png
description:
  en: Convert RGB to hexadecimal or hexadecimal to RGB.
  zh-hans: 将 RGB 转换为十六进制，或将十六进制转换为 RGB。
  zh-hant: 將 RGB 轉換為十六進位，或將十六進位轉換為 RGB。
  ja: RGBと16進数を相互に変換します。
  ko: RGB와 16진수 색상을 서로 변환합니다.
  fr: Convertir RGB en hexadécimal et inversement.
  es: Convierte RGB a hexadecimal y viceversa.
keywords: color rgb hex hexadecimal
requirements: [text, paste]
options:
  - identifier: opt_hex_with_hash
    label:
      en: 'Hex With #'
      zh-hans: 'Hex 带 #'
      zh-hant: 'Hex 帶 #'
      ja: '#付きのHex'
      ko: '# 포함 Hex'
      fr: 'Hex avec #'
      es: 'Hex con #'
    type: boolean
    default value: true
  - identifier: opt_hex_uppercase
    label:
      en: 'Hex to Uppercase'
      zh-hans: 'Hex 转大写'
      zh-hant: 'Hex 轉大寫'
      ja: 'Hexを大文字にする'
      ko: 'Hex 대문자'
      fr: 'Hexadécimal en majuscules'
      es: 'Hexadecimal en mayúsculas'
    type: boolean
    default value: true
actions:
  - title:
      en: 'RGB to Hex'
      zh-hans: 'RGB 转 Hex'
      zh-hant: 'RGB 轉 Hex'
      ja: 'RGBからHex'
      ko: 'RGB를 Hex로'
      fr: 'RGB vers Hex'
      es: 'RGB a Hex'
    icon: square filled Hex
    regex: ^\s*?\(?\s*?(000|0?\d{1,2}|1\d\d|2[0-4]\d|25[0-5])\s*?,\s*?(000|0?\d{1,2}|1\d\d|2[0-4]\d|25[0-5])\s*?,\s*?(000|0?\d{1,2}|1\d\d|2[0-4]\d|25[0-5])\s*?\)?\s*$
    javascript: |
      const opt_hash = popclip.options['opt_hex_with_hash'];
      const opt_uppercase = popclip.options['opt_hex_uppercase'];
      const rgb = popclip.input.text.replace(/[\(\)]/, '').split(',');
      let hex = opt_hash ? '#' : '';
      for (let i = 0; i < rgb.length; i++) {
        let hexDigit = parseInt(rgb[i]).toString(16);
        if (hexDigit.length == 1) {
          hexDigit = '0' + hexDigit;
        }
        hex += opt_uppercase ? hexDigit.toUpperCase() : hexDigit;
      }
      popclip.showText(`${hex} copied!`);
      return hex;
    after: paste-result
  - title:
      en: 'Hex to RGB'
      zh-hans: 'Hex 转 RGB'
      zh-hant: 'Hex 轉 RGB'
      ja: 'HexからRGB'
      ko: 'Hex를 RGB로'
      fr: 'Hex vers RGB'
      es: 'Hex a RGB'
    icon: square filled RGB
    regex: ^#?([0-9a-fA-F]{6})$
    javascript: |
      const hex = popclip.input.text.replace('#', '');
      let rgb = [];
      for (let i = 0; i < 3; i++) {
        rgb.push(parseInt(hex.substring(i * 2, i * 2 + 2), 16));
      }
      const rgbStr = rgb.join(',');
      popclip.showText(`${rgbStr} copied!`);
      return rgbStr;
    after: paste-result
