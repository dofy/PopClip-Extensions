name:
  en: PinYin
  zh-Hans: 拼音
  zh-Hant: 拼音
version: 5
identifier: xyz.phpz.popclip.extension.pinyin
icon: 拼
popclip version: 6159
description:
  en: convert Chinese characters to pinyin.
  zh-Hans: 将中文字符转换为拼音.
  zh-Hant: 將中文字符轉換為拼音.
keywords: pinyin zhuyin chinese pronunciation romanization
options:
  # - identifier: read_it
  #   label:
  #     en: Read Selected Text
  #     zh-Hans: 朗读所选文本
  #     zh-Hant: 讀出所選文字
  #   type: boolean
  #   default value: true
  - identifier: pinyin_tone_type
    label:
      en: PinYin Tone Type
      zh-Hans: 拼音音调类型
      zh-Hant: 拼音音調類型
    type: multiple
    values: [mark, number, alphabet]
    value labels:
      - en: Tone Mark (pīn)
        zh-Hans: 音调标记 (pīn)
        zh-Hant: 音調標記 (pīn)
      - en: Tone Number (pin1)
        zh-Hans: 音调数字 (pin1)
        zh-Hant: 音調數字 (pin1)
      - en: Tone Alphabet (pin)
        zh-Hans: 无音调 (pin)
        zh-Hant: 無音調 (pin)
  - identifier: zhuyin_tone_type
    label:
      en: Zhuyin Tone Type
      zh-Hans: 注音音调类型
      zh-Hant: 注音音調類型
    type: multiple
    values: [mark, number, alphabet]
    value labels:
      - en: Tone Mark (ㄆㄧㄣˊ)
        zh-Hans: 音调标记 (ㄆㄧㄣˊ)
        zh-Hant: 音調標記 (ㄆㄧㄣˊ)
      - en: Tone Number (ㄆㄧㄣ2)
        zh-Hans: 音调数字 (ㄆㄧㄣ2)
        zh-Hant: 音調數字 (ㄆㄧㄣ2)
      - en: Tone Alphabet (ㄆㄧㄣ)
        zh-Hans: 无音调 (ㄆㄧㄣ)
        zh-Hant: 無音調 (ㄆㄧㄣ)
  - identifier: output_mode
    label:
      en: Output
      zh-Hans: 输出方式
      zh-Hant: 輸出方式
    description:
      en: Choose whether to show the result, copy it, or do both.
      zh-Hans: 选择仅显示、仅复制，或显示并复制结果。
      zh-Hant: 選擇僅顯示、僅複製，或顯示並複製結果。
    type: multiple
    values: [show, show-copy, copy]
    value labels:
      - en: Show Result Only
        zh-Hans: 仅显示结果
        zh-Hant: 僅顯示結果
      - en: Show and Copy
        zh-Hans: 显示并复制
        zh-Hant: 顯示並複製
      - en: Copy Only
        zh-Hans: 仅复制
        zh-Hant: 僅複製
    default value: show-copy
    inset: true
actions:
  - submenu:
      - title:
          en: PinYin
          zh-Hans: 拼音
          zh-Hant: 拼音
        icon: 拼
        javascript file: pinyin.js
      - title:
          en: Zhuyin
          zh-Hans: 注音
          zh-Hant: 注音
        icon: 注
        javascript file: zhuyin.js
